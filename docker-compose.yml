services:
  db:
    image: postgres:16-alpine
    container_name: jaafar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jaafar_accounting}
    volumes:
      - jaafar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jaafar

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaafar-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jaafar_accounting}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      INVOICE_READER_PROVIDER: ${INVOICE_READER_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - jaafar_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5050/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - jaafar

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jaafar-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - jaafar

volumes:
  jaafar_pgdata:
  jaafar_uploads:

networks:
  jaafar:
    driver: bridge
